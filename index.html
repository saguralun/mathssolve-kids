<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MathsSolve Kids</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="setup-screen" id="setupScreen" aria-labelledby="setupHeading">
      <form class="setup-panel" id="setupForm">
        <header class="setup-header">
          <div>
            <p class="setup-kicker">MathsSolve Kids</p>
            <h1 id="setupHeading">เลือกชุดโจทย์</h1>
          </div>
          <button class="setup-start-button setup-start-button-top" type="submit">เริ่มทำโจทย์</button>
        </header>

        <div class="setup-grid">
          <section class="setup-card problem-type-card" aria-labelledby="problemTypeHeading">
            <div class="setup-section-heading">
              <h2 id="problemTypeHeading">เรื่อง</h2>
              <p>เลือกเรื่องของโจทย์</p>
            </div>
            <div class="category-options" id="categoryOptions"></div>
          </section>

          <section class="setup-card setup-controls-card difficulty-card" aria-labelledby="difficultyHeading">
            <div class="setup-section-heading">
              <h2 id="difficultyHeading">ระดับความยากของเรื่อง</h2>
              <p>เลือกความง่ายยากของเรื่องนี้</p>
            </div>

            <div class="level-control">
              <div class="level-row">
                <label class="field-label" for="learningLevelInput">ความยาก</label>
                <output id="learningLevelValue" for="learningLevelInput">3</output>
              </div>
              <input id="learningLevelInput" name="learningLevel" type="range" min="1" max="5" value="3" />
              <p class="level-description" id="levelDescription"></p>
            </div>
          </section>

          <section class="setup-card setup-summary-card" aria-labelledby="setOptionsHeading">
            <div class="setup-section-heading">
              <h2 id="setOptionsHeading">ชุดโจทย์</h2>
              <p>เลือกระดับชั้นและจำนวนข้อ</p>
            </div>
            <div class="setup-field grade-field">
              <label class="field-label" for="gradeSelect">ระดับชั้น</label>
              <select id="gradeSelect" name="grade"></select>
            </div>
            <div class="count-block">
              <span class="field-label">จำนวนข้อ</span>
              <div class="count-options" id="countOptions"></div>
            </div>
            <div class="setup-summary" id="setupSummary" aria-live="polite"></div>
            <button class="setup-start-button setup-start-button-bottom" type="submit">เริ่มทำโจทย์</button>
          </section>
        </div>
      </form>
    </section>

    <main class="app-shell is-hidden" id="practiceScreen">
      <section class="problem-zone" aria-labelledby="problemHeading">
        <h1 class="sr-only" id="problemHeading">โจทย์ปัญหา</h1>
        <article class="problem-card" aria-live="polite">
          <div class="problem-meta">
            <span id="problemNumber">ข้อที่ 1</span>
            <nav class="question-progress" id="questionProgress" aria-label="เลือกข้อที่จะทำ"></nav>
            <div class="problem-actions">
              <button class="mini-button setup-return-button" id="backToSetupButton" type="button" title="เลือกชุดโจทย์" aria-label="กลับไปเลือกชุดโจทย์">
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <path d="M4 11.5L12 5l8 6.5" />
                  <path d="M6.5 10.5V20h11v-9.5" />
                  <path d="M10 20v-5h4v5" />
                </svg>
              </button>
              <span class="timer-pill" id="timerDisplay" aria-label="ใช้เวลา 0 นาที 0 วินาที">
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <circle cx="12" cy="13" r="7" />
                  <path d="M12 13V9" />
                  <path d="M12 13h3" />
                  <path d="M9 3h6" />
                  <path d="M12 3v3" />
                </svg>
                <span>00:00</span>
              </span>
              <button class="mini-button nav-button" id="prevProblemButton" type="button" title="ข้อก่อนหน้า" aria-label="ข้อก่อนหน้า">
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <path d="M15 6l-6 6 6 6" />
                </svg>
              </button>
              <button class="submit-answer-button" id="submitAnswerButton" type="button">ส่งคำตอบ</button>
              <button class="mini-button nav-button" id="nextProblemButton" type="button" title="ข้อถัดไป" aria-label="ข้อถัดไป">
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <path d="M9 6l6 6-6 6" />
                </svg>
              </button>
            </div>
          </div>
          <p id="problemText"></p>
          <div class="problem-diagram" id="problemDiagram" hidden></div>
        </article>
      </section>

      <section class="scratch-zone" aria-labelledby="scratchHeading">
        <h2 class="sr-only" id="scratchHeading">กระดาษทด</h2>
        <div class="scratch-paper">
          <canvas id="scratchCanvas" aria-label="กระดาษทดสำหรับเขียนด้วยเมาส์หรือปากกา"></canvas>
          <div class="answer-stack">
            <div class="scratch-tools" aria-label="เครื่องมือกระดาษทด">
              <button class="tool-button active" id="penToolButton" type="button" title="ปากกา" aria-label="ปากกา" aria-pressed="true">
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <path d="M4 20h4l10.5-10.5a2.8 2.8 0 0 0-4-4L4 16v4z" />
                  <path d="M13.5 6.5l4 4" />
                </svg>
              </button>
              <button class="tool-button" id="eraserToolButton" type="button" title="ยางลบ" aria-label="ยางลบ" aria-pressed="false">
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <path d="M7 17l-3-3 8-8a2.1 2.1 0 0 1 3 0l3 3a2.1 2.1 0 0 1 0 3l-5 5H7z" />
                  <path d="M10 9l5 5" />
                  <path d="M7 17h12" />
                </svg>
              </button>
              <input id="penSizeInput" type="range" min="2" max="22" value="6" title="ขนาดเส้น" aria-label="ขนาดเส้น" />
              <button class="tool-button" id="clearScratchButton" type="button" title="ล้างกระดาษ" aria-label="ล้างกระดาษ">
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <path d="M7 3h7l3 3v15H7V3z" />
                  <path d="M14 3v4h4" />
                  <path d="M10 12h5" />
                  <path d="M10 16h4" />
                </svg>
              </button>
            </div>
            <aside class="answer-sheet" aria-label="กระดาษฝนคำตอบ 5 หลัก">
              <div class="answer-display" id="answerDisplay" aria-label="คำตอบที่เลือก"></div>
              <div class="bubble-grid" id="answerBubbleGrid"></div>
              <p class="submit-status" id="submitStatus" aria-live="polite"></p>
            </aside>
          </div>
        </div>
      </section>
    </main>

    <script src="src/masterData.js"></script>
    <script src="src/solver.js"></script>
    <script src="src/problemBank.js"></script>
    <script src="src/app.js"></script>
  </body>
</html>
